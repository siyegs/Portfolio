<svg width="1200" height="840" viewBox="0 0 1200 840" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="expo-ota-guard - is this change safe to ship over the air?">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#1c1408"/>
    </linearGradient>
    <radialGradient id="glow" cx="620" cy="330" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="verdict" x1="96" y1="0" x2="1104" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="840" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="840" rx="28" fill="url(#glow)"/>

  <!-- command chip -->
  <g transform="translate(96 84)">
    <rect width="392" height="46" rx="23" fill="#0b1120" stroke="#26313f" stroke-width="1.5"/>
    <text x="26" y="30" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" letter-spacing="1.2" fill="#64748b">$</text>
    <text x="50" y="30" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" letter-spacing="1.2" fill="#cbd5e1">npx expo-ota-guard</text>
  </g>

  <!-- verdict banner -->
  <g transform="translate(96 178)">
    <rect width="1008" height="184" rx="18" fill="url(#verdict)" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="2"/>
    <rect width="8" height="184" rx="4" fill="#f59e0b"/>

    <!-- shield -->
    <g transform="translate(60 44)">
      <path d="M48 0 L96 20 V52 C96 78 76 94 48 100 C20 94 0 78 0 52 V20 Z" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-width="3"/>
      <path d="M48 30 V58" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
      <circle cx="48" cy="74" r="4.5" fill="#f59e0b"/>
    </g>

    <text x="204" y="82" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="42" font-weight="700" letter-spacing="2" fill="#fbbf24">UNSAFE TO OTA</text>
    <text x="206" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#cbd5e1">This change alters the native layer. Ship a build, not an update.</text>
  </g>

  <!-- classification tallies -->
  <g transform="translate(96 396)" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
    <g>
      <rect width="324" height="96" rx="14" fill="#0e1830" stroke="#26313f" stroke-width="1.5"/>
      <circle cx="34" cy="48" r="8" fill="#f59e0b"/>
      <text x="58" y="42" font-size="34" font-weight="700" fill="#f8fafc">7</text>
      <text x="58" y="72" font-size="17" letter-spacing="1" fill="#94a3b8">native-affecting</text>
    </g>
    <g transform="translate(342 0)">
      <rect width="324" height="96" rx="14" fill="#0e1830" stroke="#26313f" stroke-width="1.5"/>
      <circle cx="34" cy="48" r="8" fill="#64748b"/>
      <text x="58" y="42" font-size="34" font-weight="700" fill="#f8fafc">0</text>
      <text x="58" y="72" font-size="17" letter-spacing="1" fill="#94a3b8">needs review</text>
    </g>
    <g transform="translate(684 0)">
      <rect width="324" height="96" rx="14" fill="#0e1830" stroke="#26313f" stroke-width="1.5"/>
      <circle cx="34" cy="48" r="8" fill="#4ade80"/>
      <text x="58" y="42" font-size="34" font-weight="700" fill="#f8fafc">22</text>
      <text x="58" y="72" font-size="17" letter-spacing="1" fill="#94a3b8">OTA-safe</text>
    </g>
  </g>

  <!-- runtime targeting line -->
  <g transform="translate(96 528)" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18">
    <text x="0" y="0" letter-spacing="1.4" fill="#64748b">LIVE RUNTIME</text>
    <text x="176" y="0" letter-spacing="1.4" fill="#7dd3fc">1.0.7</text>
    <text x="256" y="0" letter-spacing="1.4" fill="#334155">/</text>
    <text x="286" y="0" letter-spacing="1.4" fill="#64748b">SOURCE</text>
    <text x="400" y="0" letter-spacing="1.4" fill="#7dd3fc">eas update:list</text>
  </g>

  <!-- title -->
  <text x="96" y="622" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="58" font-weight="700" fill="#f8fafc">expo-ota-guard</text>

  <!-- subtitle -->
  <text x="98" y="672" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" fill="#94a3b8">Know before you publish - OTA-safe, or does it need a build?</text>

  <!-- badges -->
  <g transform="translate(96 716)" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600">
    <g>
      <rect width="140" height="48" rx="10" fill="#0e1830" stroke="#26313f" stroke-width="1.5"/>
      <text x="70" y="31" text-anchor="middle" fill="#fbbf24">CLI</text>
    </g>
    <g transform="translate(156 0)">
      <rect width="182" height="48" rx="10" fill="#0e1830" stroke="#26313f" stroke-width="1.5"/>
      <text x="91" y="31" text-anchor="middle" fill="#fbbf24">CI gate</text>
    </g>
    <g transform="translate(354 0)">
      <rect width="212" height="48" rx="10" fill="#0e1830" stroke="#26313f" stroke-width="1.5"/>
      <text x="106" y="31" text-anchor="middle" fill="#fbbf24">Zero config</text>
    </g>
    <g transform="translate(582 0)">
      <rect width="230" height="48" rx="10" fill="#0e1830" stroke="#26313f" stroke-width="1.5"/>
      <text x="115" y="31" text-anchor="middle" fill="#4ade80">1 runtime dep</text>
    </g>
  </g>
</svg>
