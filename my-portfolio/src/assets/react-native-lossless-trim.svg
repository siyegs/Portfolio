<svg width="1200" height="840" viewBox="0 0 1200 840" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="react-native-lossless-trim - lossless, ffmpeg-free video trimming">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <radialGradient id="glow" cx="600" cy="410" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="keep" x1="470" y1="0" x2="730" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="840" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="840" rx="28" fill="url(#glow)"/>

  <!-- top chip -->
  <g transform="translate(96 92)">
    <rect width="360" height="46" rx="23" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="30" cy="23" r="6" fill="#4ade80"/>
    <text x="52" y="30" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" letter-spacing="1.5" fill="#cbd5e1">LOSSLESS  ·  NO FFMPEG</text>
  </g>

  <!-- film-strip timeline: keep the middle, trim the ends -->
  <g transform="translate(96 250)">
    <!-- full strip (dimmed = trimmed away) -->
    <rect x="0" y="24" width="1008" height="150" rx="16" fill="#0e1830" stroke="#1e293b" stroke-width="1.5"/>
    <!-- sprocket holes -->
    <g fill="#1e293b">
      <rect x="34" y="40" width="26" height="18" rx="4"/><rect x="96" y="40" width="26" height="18" rx="4"/><rect x="158" y="40" width="26" height="18" rx="4"/><rect x="220" y="40" width="26" height="18" rx="4"/><rect x="282" y="40" width="26" height="18" rx="4"/><rect x="344" y="40" width="26" height="18" rx="4"/><rect x="406" y="40" width="26" height="18" rx="4"/><rect x="468" y="40" width="26" height="18" rx="4"/><rect x="530" y="40" width="26" height="18" rx="4"/><rect x="592" y="40" width="26" height="18" rx="4"/><rect x="654" y="40" width="26" height="18" rx="4"/><rect x="716" y="40" width="26" height="18" rx="4"/><rect x="778" y="40" width="26" height="18" rx="4"/><rect x="840" y="40" width="26" height="18" rx="4"/><rect x="902" y="40" width="26" height="18" rx="4"/><rect x="948" y="40" width="26" height="18" rx="4"/>
      <rect x="34" y="140" width="26" height="18" rx="4"/><rect x="96" y="140" width="26" height="18" rx="4"/><rect x="158" y="140" width="26" height="18" rx="4"/><rect x="220" y="140" width="26" height="18" rx="4"/><rect x="282" y="140" width="26" height="18" rx="4"/><rect x="344" y="140" width="26" height="18" rx="4"/><rect x="406" y="140" width="26" height="18" rx="4"/><rect x="468" y="140" width="26" height="18" rx="4"/><rect x="530" y="140" width="26" height="18" rx="4"/><rect x="592" y="140" width="26" height="18" rx="4"/><rect x="654" y="140" width="26" height="18" rx="4"/><rect x="716" y="140" width="26" height="18" rx="4"/><rect x="778" y="140" width="26" height="18" rx="4"/><rect x="840" y="140" width="26" height="18" rx="4"/><rect x="902" y="140" width="26" height="18" rx="4"/><rect x="948" y="140" width="26" height="18" rx="4"/>
    </g>

    <!-- kept selection (highlighted, lossless) -->
    <rect x="372" y="16" width="300" height="166" rx="16" fill="url(#keep)" opacity="0.16"/>
    <rect x="372" y="16" width="300" height="166" rx="16" fill="none" stroke="url(#keep)" stroke-width="3"/>

    <!-- trim handles -->
    <g stroke="#38bdf8" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M 372 44 L 372 154"/>
      <path d="M 672 44 L 672 154"/>
    </g>
    <g fill="#38bdf8">
      <rect x="360" y="86" width="12" height="26" rx="4"/>
      <rect x="672" y="86" width="12" height="26" rx="4"/>
    </g>

    <text x="522" y="108" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" letter-spacing="2" fill="#e0f2fe">STREAM COPY</text>
  </g>

  <!-- title -->
  <text x="96" y="560" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="52" font-weight="700" fill="#f8fafc">react-native-lossless-trim</text>

  <!-- subtitle -->
  <text x="98" y="612" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" fill="#94a3b8">Native passthrough trim - no re-encode, no ffmpeg</text>

  <!-- badges -->
  <g transform="translate(96 668)" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600">
    <g>
      <rect width="118" height="48" rx="10" fill="#0e1830" stroke="#1e293b" stroke-width="1.5"/>
      <text x="59" y="31" text-anchor="middle" fill="#7dd3fc">iOS</text>
    </g>
    <g transform="translate(134 0)">
      <rect width="150" height="48" rx="10" fill="#0e1830" stroke="#1e293b" stroke-width="1.5"/>
      <text x="75" y="31" text-anchor="middle" fill="#7dd3fc">Android</text>
    </g>
    <g transform="translate(300 0)">
      <rect width="192" height="48" rx="10" fill="#0e1830" stroke="#1e293b" stroke-width="1.5"/>
      <text x="96" y="31" text-anchor="middle" fill="#7dd3fc">New Arch</text>
    </g>
    <g transform="translate(508 0)">
      <rect width="176" height="48" rx="10" fill="#0e1830" stroke="#1e293b" stroke-width="1.5"/>
      <text x="88" y="31" text-anchor="middle" fill="#4ade80">~0 MB added</text>
    </g>
  </g>
</svg>
